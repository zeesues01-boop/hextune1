name: Build Hex Tune VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        shell: bash
        run: |
          F=$(find . -name CMakeLists.txt -not -path "./build/*" | head -n 1)
          if [ -z "$F" ]; then echo "CMakeLists.txt not found in repo - upload it"; exit 1; fi
          echo "SRC=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Found project in $(dirname "$F")"

      - name: Configure
        shell: bash
        run: cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target HexTune_VST3 --parallel

      - name: Package
        shell: bash
        run: |
          mkdir out
          find build -name "*.vst3" -maxdepth 6 -exec cp -R {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: HexTune-VST3-${{ matrix.os }}
          path: out
