name: Build Hex Tune VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target HexTune_VST3 --parallel

      - name: Package
        shell: bash
        run: |
          mkdir out
          find build -name "*.vst3" -maxdepth 6 -exec cp -R {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: HexTune-VST3-${{ matrix.os }}
          path: out
